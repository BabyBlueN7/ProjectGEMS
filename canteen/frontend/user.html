<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Canteen Dashboard</title>
  <style>
    body { font-family: Arial; background: #f9fafb; margin: 0; padding: 0; }
    header { background: #f59e0b; color: #fff; padding: 16px; text-align: center; }
    nav { background: #fff; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 6px rgba(0,0,0,0.05); }
    nav a { text-decoration: none; color: #2563eb; font-weight: bold; margin-left: 12px; }
    main { padding: 20px; }
    .item { background: #fff; padding: 12px; margin: 8px 0; border-radius: 6px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); display: flex; justify-content: space-between; align-items: center; }
    button { background: #2563eb; color: #fff; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; }
    button:hover { background: #1e4fd6; }
    .closed { color: red; font-weight: bold; }
    .cancel-btn[disabled] {
      background: #9ca3af;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <header>
    <h1>College Canteen</h1>
  </header>

  <nav>
    <span>Welcome, <b id="student-name">Student</b></span>
    <div style="display: flex; justify-content: flex-end; align-items: center; padding: 10px 20px; background: #f0fdf4;">
      <span id="wallet" style="font-weight: bold; color: #10b981; margin-right: 20px;">₹0</span>
      <a href="wallet.html">Add Money</a>
      <a href="my-orders.html" style="margin-right: 15px;">My Orders</a>
      <a href="login.html">Logout</a>
    </div>
  </nav>

  <main>
    <h2>Today’s Menu</h2>
    <div id="menu"></div>
  </main>

  <script>
    const user = JSON.parse(localStorage.getItem("user"));
    const customerId = user?.id;
    const collegeId = user?.college_id;

    document.getElementById("student-name").innerText = user?.name || "Student";

    async function isCanteenOpen() {
      try {
        const res = await fetch(`http://localhost:4002/canteen/status/${collegeId}`);
        const data = await res.json();
        return data.is_open;
      } catch (err) {
        console.error("Failed to check canteen status:", err);
        return false;
      }
    }

    async function placeOrder(itemId) {
      try {
        const res = await fetch("http://localhost:4002/orders", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            customer_id: customerId,
            item_id: itemId,
            quantity: 1,
            college_id: collegeId
          })
        });

        const data = await res.json();
        if (data?.id) {
          alert(`Order placed ✅ (Order ID: ${data.id})`);
        } else {
          alert("Order failed ❌: " + (data.error || "Unknown error"));
        }
      } catch (err) {
        console.error("Failed to place order:", err);
        alert("Failed to place order ❌");
      }
    }

    async function renderMenu() {
      const container = document.getElementById("menu");
      container.innerHTML = "";

      const open = await isCanteenOpen();
      if (!open) {
        container.innerHTML = `<p class="closed">Canteen is currently closed by the owner.</p>`;
        return;
      }

      try {
        const res = await fetch(`http://localhost:4002/menu/today/${collegeId}`);
        const items = await res.json();

        if (items.length === 0) {
          container.innerHTML = "<p>No items available today.</p>";
          return;
        }

        items.forEach(item => {
          const div = document.createElement("div");
          div.className = "item";
          div.innerHTML = `
            <span>${item.item}</span>
            <span>₹${item.price}</span>
            <button>Order</button>
          `;
          div.querySelector("button").addEventListener("click", () => placeOrder(item.id));
          container.appendChild(div);
        });
      } catch (err) {
        console.error("Failed to load menu:", err);
        container.innerHTML = "<p>Failed to load menu. Please try again later.</p>";
      }
    }

    async function loadCanteenUserWallet() {
      try {
        const res = await fetch(`http://localhost:4002/wallet/${user.id}`);
        const data = await res.json();
        document.getElementById("wallet").innerText = `Wallet Balance: ₹${data.balance}`;
      } catch (err) {
        console.error("Error loading wallet:", err);
        document.getElementById("wallet").innerText = "₹0";
      }
    }

    loadCanteenUserWallet();
    renderMenu();
  </script>
</body>
</html>
