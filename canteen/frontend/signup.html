<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Student Sign Up</title>
  <style>
    body {
      font-family: Arial;
      background: #f6f7fb;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .box {
      background: #fff;
      padding: 28px;
      width: 380px;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
    }
    h2 {
      text-align: center;
      margin: 0 0 18px;
    }
    select, input {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border: 1px solid #cdd4da;
      border-radius: 8px;
    }
    button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    button:hover {
      background: #1e40af;
    }
    .links {
      text-align: center;
      margin-top: 12px;
      font-size: 14px;
    }
    .links a {
      color: #2563eb;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="box">
    <h2>Student Sign Up</h2>
    <select id="college"></select>
    <input type="text" id="name" placeholder="Name" />
    <input type="text" id="admission_no" placeholder="Admission Number" />
    <input type="text" id="contact" placeholder="Contact (Phone or Email)" />
    <input type="password" id="password" placeholder="Password" />
    <button onclick="signup()">Create Student Account</button>
    <div class="links">
      <p>Already have an account? <a href="login.html">Login</a></p>
    </div>
  </div>

  <script>
    async function loadColleges() {
      try {
        const res = await fetch("http://localhost:4002/colleges");
        const colleges = await res.json();
        const select = document.getElementById("college");
        select.innerHTML = '<option value="">-- Select College --</option>' +
          colleges.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
      } catch (err) {
        alert("Failed to load colleges.");
        console.error(err);
      }
    }

    loadColleges();

    async function signup() {
      const college_id = document.getElementById("college").value;
      const name = document.getElementById("name").value.trim();
      const admission_no = document.getElementById("admission_no").value.trim();
      const contact = document.getElementById("contact").value.trim();
      const password = document.getElementById("password").value.trim();

      if (!college_id || !name || !admission_no || !contact || !password) {
        alert("Please fill all fields");
        return;
      }

      try {
        const res = await fetch("http://localhost:4002/signup", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            name,
            admission_no,
            contact,
            password,
            role: "student",
            college_id
          })
        });

        const data = await res.json();
        if (data.error) alert(data.error);
        else {
          alert("Student account created!");
          window.location.href = "login.html";
        }
      } catch (err) {
        console.error("Signup failed:", err);
        alert("Signup failed. Check console.");
      }
    }
  </script>
</body>
</html>
