<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>My Canteen Orders</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f9fafb;
      margin: 0;
      padding: 0;
    }
    header {
      background: #f59e0b;
      color: #fff;
      padding: 16px;
      text-align: center;
    }
    main {
      padding: 20px;
    }
    .order {
      background: #fff;
      padding: 12px;
      margin: 8px 0;
      border-radius: 6px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    .status { font-weight: bold; }
    .pending { color: orange; }
    .preparing { color: blue; }
    .ready { color: purple; }
    .delivered { color: green; }
    .canceled { color: red; }
    .empty {
      color: #ef4444;
      font-weight: bold;
    }
    button.cancel-btn {
      background: #ef4444;
      color: #fff;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 6px;
    }
    button.cancel-btn:hover {
      background: #dc2626;
    }
  </style>
</head>
<body>
  <header>
    <h1>My Orders</h1>
  </header>
  <main>
    <h2>Recent Food Orders</h2>
    <div id="orders"></div>
  </main>

  <script>
    const user = JSON.parse(localStorage.getItem("user")); // logged-in student
    const customerId = user?.id;

    async function loadOrders() {
      const container = document.getElementById("orders");
      container.innerHTML = "<p>Loading...</p>";

      try {
        const res = await fetch(`http://localhost:4002/orders/${customerId}`);
        const orders = await res.json();

        container.innerHTML = "";

        if (orders.length === 0) {
          container.innerHTML = "<p class='empty'>No orders yet.</p>";
          return;
        }

        orders.forEach(o => {
          container.innerHTML += `
            <div class="order">
              <p><strong>Order ID:</strong> ${o.id}</p>
              <p><strong>Item:</strong> ${o.item} (₹${o.price})</p>
              <p><strong>Quantity:</strong> ${o.quantity}</p>
              <p class="status ${o.status}">Status: ${o.status}</p>
              ${o.status === "pending" || o.status === "preparing" ? 
                `<button class="cancel-btn" onclick="cancelOrder(${o.id})">Cancel Order</button>` : ""}
            </div>
          `;
        });
      } catch (err) {
        console.error("Error loading orders:", err);
        container.innerHTML = "<p class='empty'>Failed to load orders.</p>";
      }
    }

    async function cancelOrder(orderId) {
      if (!confirm("Cancel this order?")) return;
      try {
        await fetch(`http://localhost:4002/orders/${orderId}/status`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ status: "canceled" })
        });
        alert("Order canceled. Refund will be processed 💸");
        loadOrders();
      } catch (err) {
        console.error("Error canceling order:", err);
        alert("Failed to cancel order ❌");
      }
    }

    loadOrders();
  </script>
</body>
</html>
