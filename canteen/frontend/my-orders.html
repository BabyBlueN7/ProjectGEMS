<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>My Canteen Orders</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f9fafb;
      margin: 0;
      padding: 0;
    }
    header {
      background: #f59e0b;
      color: #fff;
      padding: 16px;
      text-align: center;
    }
    main {
      padding: 20px;
    }
    .order {
      background: #fff;
      padding: 12px;
      margin: 8px 0;
      border-radius: 6px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    .status { font-weight: bold; }
    .pending { color: orange; }
    .preparing { color: blue; }
    .ready { color: purple; }
    .delivered { color: green; }
    .canceled { color: red; }
    .empty {
      color: #ef4444;
      font-weight: bold;
    }
    button.cancel-btn {
      background: #ef4444;
      color: #fff;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 6px;
    }
    button.cancel-btn:hover {
      background: #dc2626;
    }

    /* Tracker styles */
    .tracker {
      display: flex;
      justify-content: space-between;
      margin-top: 10px;
    }
    .step {
      flex: 1;
      text-align: center;
      font-size: 12px;
      position: relative;
    }
    .step::before {
      content: "";
      display: block;
      margin: 0 auto 6px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #d1d5db; /* gray */
    }
    .step.active::before {
      background: #2563eb; /* blue */
    }
    .step.done::before {
      background: #10b981; /* green */
    }
    .step::after {
      content: "";
      position: absolute;
      top: 7px;
      left: 50%;
      width: 100%;
      height: 2px;
      background: #d1d5db;
      z-index: -1;
    }
    .step:last-child::after {
      display: none;
    }
    .step.done + .step::after {
      background: #10b981;
    }
  </style>
</head>
<body>
  <header>
    <h1>My Orders</h1>
  </header>
  <main>
    <h2>Recent Food Orders</h2>
    <div id="orders"></div>
  </main>

  <script>
    const user = JSON.parse(localStorage.getItem("user")); // logged-in student
    const customerId = user?.id;

    function renderTracker(status) {
      const steps = ["pending", "preparing", "ready", "delivered"];
      return `
        <div class="tracker">
          ${steps.map(s => `
            <div class="step ${status === s ? 'active' : (steps.indexOf(s) < steps.indexOf(status) ? 'done' : '')}">
              ${s.charAt(0).toUpperCase() + s.slice(1)}
            </div>
          `).join("")}
        </div>
      `;
    }

    async function loadOrders() {
      const container = document.getElementById("orders");
      container.innerHTML = "<p>Loading...</p>";

      try {
        const res = await fetch(`http://localhost:4002/orders/${customerId}`);
        const orders = await res.json();

        container.innerHTML = "";

        if (orders.length === 0) {
          container.innerHTML = "<p class='empty'>No orders yet.</p>";
          return;
        }

        orders.forEach(o => {
          container.innerHTML += `
            <div class="order">
              <p><strong>Order ID:</strong> ${o.id}</p>
              <p><strong>Item:</strong> ${o.item} (₹${o.price})</p>
              <p><strong>Quantity:</strong> ${o.quantity}</p>
              <p class="status ${o.status}">Status: ${o.status}</p>
              ${o.status !== "canceled" ? renderTracker(o.status) : ""}
              ${o.status === "pending" || o.status === "preparing" ? 
                `<button class="cancel-btn" onclick="cancelOrder(${o.id})">Cancel Order</button>` : ""}
            </div>
          `;
        });
      } catch (err) {
        console.error("Error loading orders:", err);
        container.innerHTML = "<p class='empty'>Failed to load orders.</p>";
      }
    }

    async function cancelOrder(orderId) {
      if (!confirm("Cancel this order?")) return;
      try {
        await fetch(`http://localhost:4002/orders/${orderId}/status`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ status: "canceled" })
        });
        alert("Order canceled. Refund will be processed 💸");
        loadOrders();
      } catch (err) {
        console.error("Error canceling order:", err);
        alert("Failed to cancel order ❌");
      }
    }

    loadOrders();
  </script>
</body>
</html>
