<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>CANTEEN LOGIN</title>
  <style>
    body { font-family: Arial; background: #f3f5f7; display: flex; justify-content: center; align-items: center; height: 100vh; }
    .box { background: #fff; padding: 28px; width: 340px; border-radius: 12px; box-shadow: 0 8px 20px rgba(0,0,0,0.08); }
    h2 { text-align: center; margin: 0 0 18px; }
    input { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #cdd4da; border-radius: 8px; }
    .roles { margin: 10px 0; }
    button { width: 100%; padding: 10px; margin-top: 10px; background: #2563eb; color: #fff; border: none; border-radius: 8px; cursor: pointer; }
    button:hover { background: #1e4fd6; }
    .links { text-align: center; margin-top: 12px; font-size: 14px; }
    .links a { color: #2563eb; text-decoration: none; }
  </style>
</head>
<body>
  <div class="box">
    <h2>Canteen Login</h2>
    <input type="text" id="admission" placeholder="Admission Number" />
    <input type="password" id="password" placeholder="Password" />

    <!-- Role selection -->
    <div class="roles">
      <label><input type="radio" name="role" value="student" checked /> Student</label>
      <label><input type="radio" name="role" value="owner" /> Owner</label>
    </div>

    <button onclick="login()">Login</button>

    <div class="links">
      <p>No account? <a href="signup.html">Sign up (Student)</a></p>
      <p>Owner? <a href="signup-owner.html">Sign up as Owner</a></p>
    </div>
  </div>

  <script>
    async function login() {
      const admission_no = document.getElementById("admission").value;
      const password = document.getElementById("password").value;
      const role = document.querySelector('input[name="role"]:checked').value;

      const res = await fetch("http://localhost:4002/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ admission_no, password, role })
      });

      const data = await res.json();
      if (data.error) alert(data.error);
      else {
        alert("Welcome, " + data.name + " (" + data.role + ")");
        window.location.href = "user.html";
      }
    }
  </script>
</body>
</html>
