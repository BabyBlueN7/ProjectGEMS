<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Canteen Login</title>
  <style>
    body {
      font-family: Arial;
      background: #f3f5f7;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .box {
      background: #fff;
      padding: 28px;
      width: 340px;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
      position: relative;
    }
    h2 {
      text-align: center;
      margin: 0 0 18px;
    }
    input, select {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border: 1px solid #cdd4da;
      border-radius: 8px;
    }
    .roles {
      margin: 10px 0;
    }
    button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    button:hover {
      background: #1e4fd6;
    }
    .links {
      text-align: center;
      margin-top: 12px;
      font-size: 14px;
    }
    .links a {
      color: #2563eb;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="box">
    <h2>Canteen Login</h2>

    <select id="college">
      <option value="">Loading colleges...</option>
    </select>

    <div id="student-fields">
      <input type="text" id="admission_no" placeholder="Admission Number" />
    </div>

    <div id="owner-fields" style="display: none;">
      <input type="text" id="college_code" placeholder="College Code" />
    </div>

    <input type="password" id="password" placeholder="Password" />

    <div class="roles">
      <label><input type="radio" name="role" value="student" checked /> Student</label>
      <label><input type="radio" name="role" value="owner" /> Owner</label>
    </div>

    <button onclick="login()">Login</button>

    <div class="links">
      <p>No account? <a href="signup.html">Sign up (Student)</a></p>
      <p>Owner? <a href="signup-owner.html">Sign up as Owner</a></p>
    </div>
  </div>

  <script>
    async function loadColleges() {
      try {
        const res = await fetch("http://localhost:4002/colleges");
        const colleges = await res.json();
        const select = document.getElementById("college");
        select.innerHTML = '<option value="">-- Select College --</option>' +
          colleges.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
      } catch (err) {
        console.error("Error loading colleges:", err);
        document.getElementById("college").innerHTML = "<option value=''>Error loading colleges</option>";
      }
    }

    loadColleges();

    const roleRadios = document.querySelectorAll("input[name='role']");
    roleRadios.forEach(r => r.addEventListener("change", toggleFields));

    function toggleFields() {
      const role = document.querySelector("input[name='role']:checked").value;
      document.getElementById("student-fields").style.display = role === "student" ? "block" : "none";
      document.getElementById("owner-fields").style.display = role === "owner" ? "block" : "none";
    }

    async function login() {
      const role = document.querySelector("input[name='role']:checked").value;
      const password = document.getElementById("password").value.trim();
      const college_id = document.getElementById("college").value;

      if (!college_id || !password) {
        alert("Please select a college and enter password");
        return;
      }

      let payload = { role, password, college_id };

      if (role === "student") {
        const admission_no = document.getElementById("admission_no").value.trim();
        if (!admission_no) return alert("Enter admission number");
        payload.admission_no = admission_no;
      } else {
        const college_code = document.getElementById("college_code").value.trim();
        if (!college_code) return alert("Enter college code");
        payload.college_code = college_code;
      }

      try {
        const res = await fetch("http://localhost:4002/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        const data = await res.json();
        if (data.error) {
          alert("Login failed: " + data.error);
        } else {
          localStorage.setItem("user", JSON.stringify(data));
          alert("Login successful ✅");
          window.location.href = role === "student" ? "user.html" : "owner-dashboard.html";
        }
      } catch (err) {
        console.error("Login error:", err);
        alert("Something went wrong. Try again.");
      }
    }
  </script>
</body>
</html>
