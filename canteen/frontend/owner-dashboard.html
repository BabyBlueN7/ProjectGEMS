<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Canteen Owner Dashboard</title>
  <style>
    body { font-family: Arial; background: #f9fafb; margin: 0; padding: 0; }
    header { background: #f59e0b; color: #fff; padding: 16px; text-align: center; }
    main { padding: 20px; }
    form, .orders, .menu-section {
      background: #fff;
      padding: 16px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      margin-bottom: 20px;
    }
    label { display: block; margin: 8px 0 4px; }
    input, select {
      width: 100%;
      padding: 8px;
      margin-bottom: 12px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }
    button {
      background: #2563eb;
      color: #fff;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      margin-right: 6px;
    }
    button:hover { background: #1e4fd6; }
    .order, .menu-item { border-bottom: 1px solid #eee; padding: 10px 0; }
    .status { font-weight: bold; }
    .pending { color: orange; }
    .confirmed { color: teal; }
    .preparing { color: blue; }
    .ready { color: purple; }
    .delivered { color: green; }
    .canceled { color: red; }
    .out { color: red; font-weight: bold; }
    .in { color: green; font-weight: bold; }
  </style>
</head>
<body>
  <header>
    <h1>Canteen Owner Dashboard</h1>
    <div style="display: flex; justify-content: flex-end; align-items: center; padding: 10px 20px; background: #f0fdf4;">
  <span id="wallet" style="font-weight: bold; color: #10b981; margin-right: 20px;">₹0</span>
  <a href="login.html">Logout</a>
</div>
  </header>
  <main>
    <!-- Add Menu Item -->
    <h2>Add Menu Item</h2>
    <form id="menuForm">
      <label for="item">Food Item</label>
      <input type="text" id="item" required />

      <label for="price">Price (₹)</label>
      <input type="number" id="price" required />

      <label for="in_stock">In Stock</label>
      <select id="in_stock">
        <option value="1">Yes</option>
        <option value="0">No</option>
      </select>

      <button type="submit">Add Item</button>
    </form>

    <!-- Manage Menu -->
    <h2>Manage Menu</h2>
    <div class="menu-section" id="menu-list">
      <p>Loading menu...</p>
    </div>

    <!-- Orders Section -->
    <h2>Student Orders</h2>
    <div class="orders" id="owner-orders">
      <p>Loading orders...</p>
    </div>
  </main>

  <!-- Analytics Section -->
  <div class="section" id="analytics-section">
    <h2>Analytics</h2>
    <div id="analytics">Loading...</div>
  </div>

  <script>
    const user = JSON.parse(localStorage.getItem("user"));
    const collegeId = user?.college_id;

    // Add Menu Item
document.getElementById("menuForm").addEventListener("submit", async (e) => {
  e.preventDefault();

  // ✅ Get and validate inputs
  const name = document.getElementById("item").value.trim();
  const priceStr = document.getElementById("price").value;
  const price = parseFloat(priceStr);
  const inStock = parseInt(document.getElementById("in_stock").value);

  // ✅ Validation checks
  if (!name) {
    alert("Please enter a valid food name.");
    return;
  }

  if (isNaN(price) || price <= 0) {
    alert("Please enter a valid price greater than ₹0.");
    return;
  }

  const item = {
    item: name,
    price,
    in_stock: inStock,
    college_id: collegeId
  };

  try {
    const res = await fetch("http://localhost:4002/menu", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(item)
    });

    const data = await res.json();

    if (!res.ok) {
      alert("Failed to add menu item ❌: " + (data.error || res.status));
      return;
    }

    alert(`Menu item "${data.item}" added successfully ✅`);
    e.target.reset();
    loadMenu();
  } catch (err) {
    console.error("Error adding menu item:", err);
    alert("Failed to add menu item ❌");
  }
});

    // Load Menu Items
    async function loadMenu() {
      try {
        const res = await fetch(`http://localhost:4002/menu/all/${collegeId}`);
        const menu = await res.json();
        const container = document.getElementById("menu-list");
        container.innerHTML = "";

        if (menu.length === 0) {
          container.innerHTML = "<p>No menu items yet.</p>";
          return;
        }

        menu.forEach(m => {
          container.innerHTML += `
            <div class="menu-item">
              <b>${m.item}</b> — ₹${m.price} 
              <span class="${m.in_stock ? 'in' : 'out'}">(${m.in_stock ? 'Available' : 'Out of Stock'})</span>
              <button onclick="showEditForm(${m.id}, '${m.item}', ${m.price}, ${m.in_stock})">Edit</button>
            </div>
          `;
        });
      } catch (err) {
        console.error("Error loading menu:", err);
        document.getElementById("menu-list").innerHTML = "<p>Failed to load menu ❌</p>";
      }
    }

    // Show Edit Form for Menu Item
    function showEditForm(id, item, price, in_stock) {
      const container = document.getElementById("menu-list");
      const formId = `editForm-${id}`;
      if (document.getElementById(formId)) return;

      container.innerHTML += `
        <form id="${formId}" class="menu-item" style="background:#f3f4f6; padding:10px; border-radius:6px;">
          <h4>Edit: ${item}</h4>
          <label>Item</label>
          <input type="text" id="edit-item-${id}" value="${item}" required />
          <label>Price (₹)</label>
          <input type="number" id="edit-price-${id}" value="${price}" required />
          <label>In Stock</label>
          <select id="edit-in_stock-${id}">
            <option value="1" ${in_stock ? "selected" : ""}>Yes</option>
            <option value="0" ${!in_stock ? "selected" : ""}>No</option>
          </select>
          <button type="button" onclick="updateMenu(${id})">Save</button>
        </form>
      `;
    }

    // Update Menu Item
    async function updateMenu(id) {
      const updated = {
        item: document.getElementById(`edit-item-${id}`).value,
        price: parseInt(document.getElementById(`edit-price-${id}`).value),
        in_stock: parseInt(document.getElementById(`edit-in_stock-${id}`).value)
      };
      try {
        await fetch(`http://localhost:4002/menu/${id}`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(updated)
        });
        alert("Menu updated successfully ✅");
        loadMenu();
      } catch (err) {
        console.error("Error updating menu:", err);
        alert("Failed to update menu ❌");
      }
    }

        // Load Orders
    async function loadOwnerOrders() {
      try {
        const res = await fetch(`http://localhost:4002/owner/orders/${collegeId}`);
        const orders = await res.json();
        const container = document.getElementById("owner-orders");
        container.innerHTML = "";

        if (orders.length === 0) {
          container.innerHTML = "<p>No orders yet.</p>";
          return;
        }

        orders.forEach(o => {
          container.innerHTML += `
            <div class="order">
              <p><b>${o.item}</b> × ${o.quantity} — ordered by ${o.student_name}</p>
              <p>Status: <span class="status ${o.status}">${o.status.charAt(0).toUpperCase() + o.status.slice(1)}</span></p>
              <label>Update Status:</label>
              <select onchange="updateStatus(${o.id}, this.value)">
                <option value="pending" ${o.status === "pending" ? "selected" : ""}>Pending</option>
                <option value="confirmed" ${o.status === "confirmed" ? "selected" : ""}>Confirmed</option>
                <option value="preparing" ${o.status === "preparing" ? "selected" : ""}>Preparing</option>
                <option value="ready" ${o.status === "ready" ? "selected" : ""}>Ready</option>
                <option value="delivered" ${o.status === "delivered" ? "selected" : ""}>Delivered</option>
                <option value="canceled" ${o.status === "canceled" ? "selected" : ""}>Canceled</option>
              </select>
            </div>
          `;
        });
      } catch (err) {
        console.error("Error loading orders:", err);
        document.getElementById("owner-orders").innerHTML = "<p>Failed to load orders ❌</p>";
      }
    }

    // Update Order Status
    async function updateStatus(orderId, status) {
      try {
        await fetch(`http://localhost:4002/orders/${orderId}/status`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ status })
        });
        alert(`Order updated to ${status} ✅`);
        loadOwnerOrders();
      } catch (err) {
        console.error("Error updating status:", err);
        alert("Failed to update order ❌");
      }
    }

    // Load Analytics
    async function loadAnalytics() {
      try {
        const res = await fetch(`http://localhost:4002/owner/analytics/${user.college_id}`);
        const data = await res.json();

        document.getElementById("analytics").innerHTML = `
          <p><b>Daily Sales:</b> ${data.daily.orders} orders — ₹${data.daily.revenue || 0}</p>
          <p><b>Weekly Sales:</b> ${data.weekly.orders} orders — ₹${data.weekly.revenue || 0}</p>
          <p><b>Total Collected:</b> ₹${data.collected}</p>
          <h4>Popular Items</h4>
          <ul>
            ${data.popular.map(p => `<li>${p.item} — ${p.sold} sold</li>`).join("")}
          </ul>
        `;
      } catch (err) {
        console.error("Error loading analytics:", err);
        document.getElementById("analytics").innerHTML = "<p>Failed to load analytics ❌</p>";
      }
    }

    // Show wallet balance in nav
    async function loadCanteenOwnerWallet() {
  const user = JSON.parse(localStorage.getItem("user"));
  try {
    const res = await fetch(`http://localhost:4002/wallet/${user.id}`);
    const data = await res.json();
    document.getElementById("wallet").innerText = `₹${data.balance}`;
  } catch (err) {
    console.error("Error loading wallet:", err);
    document.getElementById("wallet").innerText = "₹0";
  }
}

    // Initial load
    loadMenu();
    loadOwnerOrders();
    loadAnalytics();
    loadCanteenOwnerWallet();
  </script>
</body>
</html>
