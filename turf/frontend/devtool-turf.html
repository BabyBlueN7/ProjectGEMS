<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Kick-Hub Devtool</title>
  <style>
    :root{ --bg:hsl(180, 11%, 96%); --card:#ffffff; --primary:#2563eb; --accent:#10b981; --muted:#6b7280; --text:#071233; --radius:12px; --shadow:0 8px 24px rgba(7,18,51,0.06); }
    body{ font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial; margin:0; padding:0; background:var(--bg); color:var(--text) }
    header h1,h3  { margin:0; padding:18px 16px; background:linear-gradient(90deg,var(--primary), #311265); color:#fff; text-align:center; font-weight:700 }
    section{ padding:20px; max-width:1100px; margin:0 auto }
    .turf{ background:var(--card); padding:16px; margin:12px 0; border-radius:var(--radius); box-shadow:var(--shadow); border:1px solid rgba(7,18,51,0.04) }
    .turf{ display:flex; align-items:center; justify-content:space-between; gap:12px }
    .turf .turf-info{ flex:1 }
    .turf img{ width:150px; height:100px; object-fit:cover; border-radius:8px; margin-left:12px }
    .turf p{ margin:6px 0 }
    .contact{ color:var(--muted); font-size:14px; margin-top:6px }
    .rating{ color:#f59e0b; font-weight:700; margin-top:6px }
    .actions button{ margin-right:8px; padding:8px 12px; border-radius:10px; border:none; cursor:pointer; font-weight:600 }
    .verify{ background:var(--accent); color:#fff }
    .reject, .remove{ background:#ef4444; color:#fff }
    .actions{ margin-top:10px }
  </style>
</head>
<body>
  <header>
    <h1>KICK-HUB</h1>
    <h3>Admin Panel</h3>
  </header>

  <section>
    <h2>Unverified Turf Requests</h2>
    <div id="unverified"></div>

    <h2>Active Verified Turfs</h2>
    <div id="verified"></div>
  </section>

  <script>
    async function loadTurfs() {
      try {
        const unverifiedRes = await fetch("http://localhost:4001/admin/turfs/unverified");
        const verifiedRes = await fetch("http://localhost:4001/admin/turfs/verified");

        const unverified = await unverifiedRes.json();
        const verified = await verifiedRes.json();

        const unverifiedDiv = document.getElementById("unverified");
        const verifiedDiv = document.getElementById("verified");

        unverifiedDiv.innerHTML = "";
        verifiedDiv.innerHTML = "";

        if (unverified.length === 0) {
          unverifiedDiv.innerHTML = "<p>No unverified turfs found.</p>";
        } else {
          unverified.forEach(t => {
            const div = document.createElement("div");
            div.className = "turf";
            div.innerHTML = `
              <h3>${t.name}</h3>
              <p>${t.sport} - ${t.location}, ${t.district}</p>
              <p>₹${t.price}/hr</p>
              ${t.contact ? `<p class="contact"><strong>Contact:</strong> ${t.contact}</p>` : ""}
              <div class="actions">
                <button class="verify" onclick="verifyTurf(${t.id})">✅ Verify</button>
                <button class="reject" onclick="rejectTurf(${t.id})">❌ Reject</button>
              </div>
            `;
            unverifiedDiv.appendChild(div);
          });
        }

        if (verified.length === 0) {
          verifiedDiv.innerHTML = "<p>No verified turfs found.</p>";
        } else {
          for (const t of verified) {
            let ratingHTML = "★ No ratings yet";
            try {
              const ratingRes = await fetch(`http://localhost:4001/ratings/turf/${t.id}`);
              const ratingData = await ratingRes.json();
              if (ratingData.average) {
                ratingHTML = `★ ${ratingData.average} (${ratingData.count})`;
              }
            } catch (err) {
              console.warn("Rating fetch failed for turf", t.id);
            }

            const div = document.createElement("div");
            div.className = "turf";
            let imageTag = '';
            if (t.image_url) {
              const src = (typeof t.image_url === 'string' && t.image_url.startsWith('http')) ? t.image_url : 'http://localhost:4001' + t.image_url;
              imageTag = `<img src="${src}" alt="${t.name}">`;
            }

            div.innerHTML = `
              <div class="turf-info">
                <h3>${t.name}</h3>
                <p>${t.sport} - ${t.location}, ${t.district}</p>
                <p>₹${t.price}/hr</p>
                <p class="rating">${ratingHTML}</p>
                ${t.contact ? `<p class="contact"><strong>Contact:</strong> ${t.contact}</p>` : ""}
                <div class="actions">
                  <button class="remove" onclick="removeTurf(${t.id})">❌ Remove</button>
                </div>
              </div>
              ${imageTag}
            `;
            verifiedDiv.appendChild(div);
          }
        }
      } catch (err) {
        console.error("Error loading turfs:", err);
      }
    }

    async function verifyTurf(id) {
      try {
        await fetch(`http://localhost:4001/admin/turfs/${id}/verify`, { method: "POST" });
        loadTurfs();
      } catch (err) {
        console.error("Error verifying turf:", err);
        alert("Failed to verify turf ❌");
      }
    }

    async function rejectTurf(id) {
      try {
        const res = await fetch(`http://localhost:4001/admin/turfs/${id}/remove`, {
          method: "DELETE"
        });

        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          alert("Failed to reject turf ❌" + (err.error ? `: ${err.error}` : ""));
          return;
        }

        loadTurfs();
      } catch (e) {
        console.error("Reject turf error:", e);
        alert("Failed to reject turf ❌");
      }
    }

    async function removeTurf(id) {
      try {
        await fetch(`http://localhost:4001/admin/turfs/${id}/remove`, { method: "DELETE" });
        loadTurfs();
      } catch (err) {
        console.error("Error removing turf:", err);
        alert("Failed to remove turf ❌");
      }
    }

    loadTurfs();
  </script>
</body>
</html>
