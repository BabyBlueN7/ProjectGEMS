<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Devtool Access | KICKHUB</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0a0f0d;
      --bg-card: #111916;
      --bg-card-hover: #162019;
      --primary: #10b981;
      --primary-light: #34d399;
      --primary-dark: #059669;
      --secondary: #14532d;
      --accent: #22c55e;
      --neon: #4ade80;
      --danger: #ef4444;
      --text: #f0fdf4;
      --text-muted: #86efac;
      --text-dim: #6b7280;
      --border: #1f3d2a;
      --gradient: linear-gradient(135deg, #10b981 0%, #059669 50%, #047857 100%);
      --gradient-danger: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
      --glow: 0 0 40px rgba(16, 185, 129, 0.3);
      --glow-strong: 0 0 60px rgba(16, 185, 129, 0.5);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: var(--bg-dark);
      color: var(--text);
      overflow-x: hidden;
    }

    /* Animated Background */
    .bg-animation {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      overflow: hidden;
    }

    .bg-animation::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(ellipse at center, rgba(239, 68, 68, 0.06) 0%, transparent 50%);
      animation: rotate 30s linear infinite;
    }

    .bg-animation::after {
      content: '';
      position: absolute;
      top: 50%;
      right: -30%;
      width: 80%;
      height: 80%;
      background: radial-gradient(ellipse at center, rgba(16, 185, 129, 0.05) 0%, transparent 60%);
      animation: float 20s ease-in-out infinite;
    }

    @keyframes rotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-50px) scale(1.1); }
    }

    /* Grid Pattern Overlay */
    .grid-pattern {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: 
        linear-gradient(rgba(239, 68, 68, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(239, 68, 68, 0.02) 1px, transparent 1px);
      background-size: 50px 50px;
      z-index: 1;
    }

    /* Floating Elements */
    .floating-elements {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    .floating-ball {
      position: absolute;
      font-size: 2rem;
      opacity: 0.1;
      animation: floatBall 15s ease-in-out infinite;
    }

    .floating-ball:nth-child(1) { top: 10%; left: 10%; animation-delay: 0s; }
    .floating-ball:nth-child(2) { top: 20%; right: 15%; animation-delay: 3s; }
    .floating-ball:nth-child(3) { bottom: 30%; left: 5%; animation-delay: 6s; }
    .floating-ball:nth-child(4) { bottom: 15%; right: 10%; animation-delay: 9s; }
    .floating-ball:nth-child(5) { top: 50%; left: 20%; animation-delay: 12s; }

    @keyframes floatBall {
      0%, 100% { transform: translateY(0) rotate(0deg); opacity: 0.1; }
      50% { transform: translateY(-30px) rotate(180deg); opacity: 0.2; }
    }

    /* Main Container */
    .main-container {
      position: relative;
      z-index: 10;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    /* Login Card */
    .login-card {
      width: 100%;
      max-width: 440px;
      background: linear-gradient(145deg, rgba(17, 25, 22, 0.95) 0%, rgba(10, 15, 13, 0.98) 100%);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 45px 40px;
      backdrop-filter: blur(20px);
      box-shadow: 
        0 25px 50px rgba(0, 0, 0, 0.5),
        0 0 100px rgba(239, 68, 68, 0.08),
        inset 0 1px 0 rgba(255, 255, 255, 0.05);
      position: relative;
      overflow: hidden;
    }

    .login-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: var(--gradient-danger);
      border-radius: 24px 24px 0 0;
    }

    .login-card::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle at 30% 20%, rgba(239, 68, 68, 0.06) 0%, transparent 40%);
      pointer-events: none;
    }

    /* Logo Section */
    .logo-section {
      text-align: center;
      margin-bottom: 35px;
      position: relative;
      z-index: 1;
    }

    .logo-container {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 20px;
    }

    .logo-icon {
      width: 60px;
      height: 60px;
      background: var(--gradient);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      box-shadow: var(--glow);
      animation: pulse-glow 3s ease-in-out infinite;
    }

    @keyframes pulse-glow {
      0%, 100% { box-shadow: var(--glow); }
      50% { box-shadow: var(--glow-strong); }
    }

    .logo-text {
      font-size: 2.2rem;
      font-weight: 900;
      letter-spacing: 2px;
      background: var(--gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .logo-tagline {
      font-size: 0.9rem;
      color: var(--text-muted);
      font-weight: 400;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    /* Welcome Text */
    .welcome-text {
      text-align: center;
      margin-bottom: 30px;
      position: relative;
      z-index: 1;
    }

    .welcome-text h1 {
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 8px;
    }

    .welcome-text p {
      color: var(--text-dim);
      font-size: 0.95rem;
    }

    .restricted-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--danger);
      margin-top: 14px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Form Styles */
    .login-form {
      position: relative;
      z-index: 1;
    }

    .form-group {
      margin-bottom: 24px;
    }

    .form-group label {
      display: block;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 10px;
      letter-spacing: 0.5px;
    }

    .input-wrapper {
      position: relative;
    }

    .input-wrapper .icon {
      position: absolute;
      left: 18px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1.2rem;
      color: var(--text-dim);
      transition: all 0.3s ease;
      z-index: 2;
    }

    .form-group input {
      width: 100%;
      padding: 18px 18px 18px 54px;
      border: 2px solid var(--border);
      border-radius: 14px;
      font-size: 1rem;
      font-family: 'Poppins', sans-serif;
      color: var(--text);
      background: rgba(10, 15, 13, 0.8);
      transition: all 0.3s ease;
    }

    .form-group input:focus {
      outline: none;
      border-color: var(--danger);
      background: rgba(239, 68, 68, 0.05);
      box-shadow: 0 0 0 4px rgba(239, 68, 68, 0.1), 0 0 30px rgba(239, 68, 68, 0.15);
    }

    .form-group input:focus ~ .icon {
      color: var(--danger);
    }

    .form-group input::placeholder {
      color: var(--text-dim);
    }

    /* Error Message */
    .error-message {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: var(--danger);
      font-size: 0.85rem;
      padding: 12px 16px;
      border-radius: 10px;
      margin-bottom: 20px;
      display: none;
      text-align: center;
    }

    .error-message.show {
      display: block;
    }

    /* Submit Button */
    .login-btn {
      width: 100%;
      padding: 18px;
      background: var(--gradient-danger);
      color: #fff;
      border: none;
      border-radius: 14px;
      font-size: 1.05rem;
      font-weight: 700;
      font-family: 'Poppins', sans-serif;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 8px 30px rgba(239, 68, 68, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      letter-spacing: 0.5px;
      position: relative;
      overflow: hidden;
    }

    .login-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
      transition: left 0.5s ease;
    }

    .login-btn:hover::before {
      left: 100%;
    }

    .login-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 40px rgba(239, 68, 68, 0.45);
    }

    .login-btn:active {
      transform: translateY(-1px);
    }

    .login-btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }

    .btn-arrow {
      font-size: 1.2rem;
      transition: transform 0.3s ease;
    }

    .login-btn:hover .btn-arrow {
      transform: translateX(5px);
    }

    /* Footer */
    .form-footer {
      text-align: center;
      margin-top: 28px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
      position: relative;
      z-index: 1;
    }

    .form-footer a {
      color: var(--primary);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      transition: all 0.3s ease;
    }

    .form-footer a:hover {
      color: var(--neon);
      text-shadow: 0 0 10px rgba(16, 185, 129, 0.5);
    }

    /* Spinner */
    .spinner {
      width: 22px;
      height: 22px;
      border: 3px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Success State */
    .login-btn.success {
      background: var(--gradient);
      box-shadow: 0 8px 30px rgba(16, 185, 129, 0.4);
    }

    /* Responsive */
    @media (max-width: 480px) {
      .login-card {
        padding: 35px 25px;
        border-radius: 20px;
      }

      .logo-container {
        flex-direction: column;
        gap: 10px;
      }

      .logo-text {
        font-size: 1.8rem;
      }

      .welcome-text h1 {
        font-size: 1.4rem;
      }
    }
  </style>
</head>
<body>
  <!-- Animated Background -->
  <div class="bg-animation"></div>
  <div class="grid-pattern"></div>
  
  <!-- Floating Elements -->
  <div class="floating-elements">
    <span class="floating-ball">⚽</span>
    <span class="floating-ball">⚽</span>
    <span class="floating-ball">⚽</span>
    <span class="floating-ball">⚽</span>
    <span class="floating-ball">⚽</span>
  </div>

  <!-- Main Container -->
  <div class="main-container">
    <div class="login-card">
      <!-- Logo Section -->
      <div class="logo-section">
        <div class="logo-container">
          <div class="logo-icon">⚽</div>
          <span class="logo-text">KICKHUB</span>
        </div>
        <p class="logo-tagline">Book • Play • Win</p>
      </div>

      <!-- Welcome Text -->
      <div class="welcome-text">
        <h1>Developer Access</h1>
        <p>Enter your access code to continue</p>
        <div class="restricted-badge">
          <span>⚠</span>
          <span>Restricted Area</span>
        </div>
      </div>

      <!-- Error Message -->
      <div class="error-message" id="errorMsg">
        Invalid access code. Please try again.
      </div>

      <!-- Login Form -->
      <form class="login-form" id="loginForm" onsubmit="submitDevcode(event)">
        <div class="form-group">
          <label for="devcode">Access Code</label>
          <div class="input-wrapper">
            <input type="password" id="devcode" placeholder="Enter dev code" required autocomplete="off" />
            <span class="icon">🔐</span>
          </div>
        </div>

        <button type="submit" class="login-btn" id="loginBtn">
          <span>Authenticate</span>
          <span class="btn-arrow">→</span>
        </button>
      </form>

      <!-- Footer -->
      <div class="form-footer">
        <a href="login.html">← Back to Login</a>
      </div>
    </div>
  </div>

  <script>
    async function submitDevcode(event) {
      event.preventDefault();
      
      const code = document.getElementById("devcode").value;
      const loginBtn = document.getElementById("loginBtn");
      const errorMsg = document.getElementById("errorMsg");

      // Hide error
      errorMsg.classList.remove("show");

      // Show loading
      loginBtn.disabled = true;
      loginBtn.innerHTML = '<div class="spinner"></div><span>Verifying...</span>';

      try {
        const res = await fetch("http://localhost:4001/devtool/turf-login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ code })
        });

        if (res.ok) {
          // Success
          loginBtn.classList.add("success");
          loginBtn.innerHTML = '<span>✓ Access Granted</span>';
          
          setTimeout(() => {
            window.location.href = "devtool-turf.html";
          }, 800);
        } else {
          // Error
          errorMsg.classList.add("show");
          loginBtn.disabled = false;
          loginBtn.innerHTML = '<span>Authenticate</span><span class="btn-arrow">→</span>';
          
          // Shake animation
          loginBtn.style.animation = 'shake 0.5s ease';
          setTimeout(() => loginBtn.style.animation = '', 500);
        }
      } catch (err) {
        console.error("Devtool login error:", err);
        errorMsg.textContent = "Connection error. Please try again.";
        errorMsg.classList.add("show");
        loginBtn.disabled = false;
        loginBtn.innerHTML = '<span>Authenticate</span><span class="btn-arrow">→</span>';
      }
    }

    // Shake animation
    const style = document.createElement('style');
    style.textContent = `
      @keyframes shake {
        0%, 100% { transform: translateX(0); }
        20%, 60% { transform: translateX(-10px); }
        40%, 80% { transform: translateX(10px); }
      }
    `;
    document.head.appendChild(style);

    // Auto-focus
    document.getElementById("devcode").focus();

    // Glow effect on focus
    document.getElementById("devcode").addEventListener('focus', function() {
      this.closest('.input-wrapper').style.filter = 'drop-shadow(0 0 8px rgba(239, 68, 68, 0.3))';
    });
    document.getElementById("devcode").addEventListener('blur', function() {
      this.closest('.input-wrapper').style.filter = 'none';
    });
  </script>
</body>
</html>
