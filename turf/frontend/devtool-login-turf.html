<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Kick-Hub Devtool Login</title>
  <style>
    :root{
      --bg:#f6f8fb;
      --card:#ffffff;
      --primary:#2563eb;
      --accent:#10b981;
      --muted:#6b7280;
      --text:#0f1724;
      --radius:12px;
      --shadow:0 8px 24px rgba(16,24,40,0.06);
    }
    html,body{height:100%;}
    body{
      margin:0;
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      background:var(--bg);
      color:var(--text);
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .box{
      background:var(--card);
      padding:28px;
      width:360px;
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      border:1px solid rgba(16,24,40,0.04);
    }
    h2{ text-align:center; margin-bottom:16px; font-weight:600; }
    input{ width:100%; padding:10px 12px; margin:8px 0; border-radius:10px; border:1px solid rgba(16,24,40,0.06); background:#fbfdff }
    button{ width:100%; padding:10px; margin-top:10px; background:var(--primary); color:#fff; border:none; border-radius:10px; cursor:pointer; font-weight:600 }
    button:hover{ filter:brightness(.96) }
  </style>
</head>
<body>
  <div class="box">
    <h2>Kick-Hub Devtool Access</h2>
    <input type="password" id="devcode" placeholder="Enter Dev Code" />
    <button onclick="submitDevcode()">Login</button>
  </div>

  <script>
    async function submitDevcode() {
      const code = document.getElementById("devcode").value;

      try {
        const res = await fetch("http://localhost:4001/devtool/turf-login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ code })
        });

        if (res.ok) {
          window.location.href = "devtool-turf.html";
        } else {
          alert("Access denied ❌");
        }
      } catch (err) {
        console.error("Devtool login error:", err);
        alert("Something went wrong. Try again.");
      }
    }
  </script>
</body>
</html>
