<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Owner Slot Manager</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
      --card: rgba(30, 41, 59, 0.8);
      --card-border: rgba(148, 163, 184, 0.1);
      --primary: #3b82f6;
      --primary-glow: rgba(59, 130, 246, 0.4);
      --accent: #10b981;
      --accent-glow: rgba(16, 185, 129, 0.4);
      --warning: #f59e0b;
      --danger: #ef4444;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --radius: 16px;
      --radius-sm: 10px;
      --shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      --glass: rgba(255, 255, 255, 0.05);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      min-height: 100vh;
      color: var(--text);
      overflow-x: hidden;
    }

    /* Animated Background */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: 
        radial-gradient(ellipse at 20% 20%, rgba(59, 130, 246, 0.15) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 80%, rgba(16, 185, 129, 0.1) 0%, transparent 50%),
        radial-gradient(ellipse at 50% 50%, rgba(139, 92, 246, 0.08) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    /* Header */
    header {
      position: relative;
      z-index: 10;
      background: linear-gradient(135deg, rgba(59, 130, 246, 0.2) 0%, rgba(16, 185, 129, 0.1) 100%);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--card-border);
      padding: 20px 0;
    }

    header h1 {
      text-align: center;
      font-size: 1.8rem;
      font-weight: 800;
      background: linear-gradient(135deg, #fff 0%, #94a3b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 16px;
    }

    nav {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }

    #welcomeText {
      display: flex;
      flex-direction: column;
      gap: 4px;
      background: var(--glass);
      padding: 12px 18px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--card-border);
    }

    #welcomeText .role {
      font-size: 0.7rem;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      font-weight: 600;
    }

    #welcomeText .name {
      font-size: 0.95rem;
      color: var(--text);
      font-weight: 600;
    }

    nav > div {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    nav a {
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.85rem;
      padding: 10px 18px;
      background: linear-gradient(135deg, var(--primary), #2563eb);
      border-radius: 50px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 15px var(--primary-glow);
      transition: all 0.3s ease;
      border: 1px solid rgba(255,255,255,0.1);
    }

    nav a:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px var(--primary-glow);
    }

    /* Main Content */
    main {
      position: relative;
      z-index: 10;
      max-width: 1200px;
      margin: 0 auto;
      padding: 32px 24px;
    }

    h2 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    h2::after {
      content: '';
      flex: 1;
      height: 2px;
      background: linear-gradient(90deg, var(--card-border), transparent);
      border-radius: 2px;
    }

    /* Date Selector */
    .date-selector {
      display: flex;
      gap: 12px;
      margin-bottom: 28px;
      flex-wrap: wrap;
    }

    .date-selector button {
      padding: 14px 24px;
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      background: var(--glass);
      color: var(--text-muted);
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
    }

    .date-selector button:hover {
      background: rgba(59, 130, 246, 0.1);
      border-color: var(--primary);
      color: var(--text);
    }

    .date-selector button.selected {
      background: linear-gradient(135deg, var(--primary), #2563eb);
      color: #fff;
      border-color: transparent;
      box-shadow: 0 8px 25px var(--primary-glow);
    }

    /* Slot Cards */
    .slot {
      background: var(--card);
      backdrop-filter: blur(20px);
      padding: 24px;
      margin: 16px 0;
      border-radius: var(--radius);
      border: 1px solid var(--card-border);
      box-shadow: var(--shadow);
      transition: all 0.3s ease;
    }

    .slot:hover {
      transform: translateY(-4px);
      border-color: rgba(59, 130, 246, 0.3);
      box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.6);
    }

    .slot-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 16px;
    }

    .slot-header > span {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--text);
      background: linear-gradient(135deg, rgba(59, 130, 246, 0.2), rgba(59, 130, 246, 0.05));
      padding: 10px 18px;
      border-radius: var(--radius-sm);
      border: 1px solid rgba(59, 130, 246, 0.2);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .slot-header .right-buttons {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 10px;
    }

    .price {
      font-weight: 800;
      font-size: 1.4rem;
      color: var(--accent);
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.2), rgba(16, 185, 129, 0.05));
      padding: 8px 16px;
      border-radius: var(--radius-sm);
      border: 1px solid rgba(16, 185, 129, 0.2);
    }

    .book-btn {
      background: linear-gradient(135deg, var(--accent), #059669);
      color: #fff;
      border: none;
      padding: 12px 24px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-weight: 700;
      font-size: 0.9rem;
      transition: all 0.3s ease;
      box-shadow: 0 6px 20px var(--accent-glow);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .book-btn:hover:not([disabled]) {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px var(--accent-glow);
    }

    button[disabled] {
      background: rgba(100, 116, 139, 0.3) !important;
      color: var(--text-dim) !important;
      cursor: not-allowed !important;
      box-shadow: none !important;
      border: 1px solid var(--card-border);
    }

    /* Players Count */
    .players-count {
      margin: 18px 0 12px 0;
      font-weight: 600;
      color: var(--text);
      font-size: 1rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Progress Bar */
    .progress {
      background: rgba(100, 116, 139, 0.2);
      border-radius: 20px;
      height: 10px;
      overflow: hidden;
      position: relative;
    }

    .progress::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
      animation: shimmer 2s infinite;
    }

    @keyframes shimmer {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    .progress-fill {
      background: linear-gradient(90deg, var(--primary), var(--accent));
      height: 100%;
      border-radius: 20px;
      transition: width 0.5s ease;
      position: relative;
      z-index: 1;
    }

    /* Status Text */
    .status-text {
      margin-top: 14px;
      font-size: 0.9rem;
      color: var(--text-muted);
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      background: var(--glass);
      border-radius: var(--radius-sm);
      border: 1px solid var(--card-border);
    }

    /* See Players Button */
    .see-players-btn {
      background: linear-gradient(135deg, rgba(139, 92, 246, 0.2), rgba(139, 92, 246, 0.05));
      color: #a78bfa;
      border: 1px solid rgba(139, 92, 246, 0.3);
      padding: 10px 18px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
      transition: all 0.3s ease;
      margin-top: 16px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .see-players-btn:hover {
      background: linear-gradient(135deg, rgba(139, 92, 246, 0.3), rgba(139, 92, 246, 0.1));
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(139, 92, 246, 0.3);
    }

    /* Player List */
    .player-list {
      background: rgba(15, 23, 42, 0.6);
      padding: 16px;
      margin-top: 16px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--card-border);
      display: none;
    }

    .player-list.show {
      display: block;
      animation: slideDown 0.3s ease;
    }

    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .player-list div {
      padding: 14px;
      border-bottom: 1px solid var(--card-border);
      transition: background 0.2s ease;
      border-radius: var(--radius-sm);
    }

    .player-list div:hover {
      background: var(--glass);
    }

    .player-list div:last-child {
      border-bottom: none;
    }

    .player-list strong {
      color: var(--text-dim);
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .player-list p {
      color: var(--text-muted);
      font-style: italic;
    }

    /* Empty State */
    #slots p {
      color: var(--text-muted);
      text-align: center;
      padding: 40px;
      font-size: 1rem;
    }

    /* Mobile Responsive */
    @media (max-width: 768px) {
      header h1 {
        font-size: 1.4rem;
      }

      nav {
        flex-direction: column;
        align-items: stretch;
        gap: 16px;
      }

      nav > div {
        justify-content: center;
      }

      nav a {
        padding: 8px 14px;
        font-size: 0.8rem;
      }

      main {
        padding: 20px 16px;
      }

      h2 {
        font-size: 1.2rem;
      }

      .date-selector {
        justify-content: center;
      }

      .date-selector button {
        padding: 12px 18px;
        font-size: 0.85rem;
      }

      .slot {
        padding: 18px;
      }

      .slot-header {
        flex-direction: column;
        align-items: stretch;
      }

      .slot-header > span {
        justify-content: center;
      }

      .slot-header .right-buttons {
        align-items: stretch;
        flex-direction: row;
        justify-content: space-between;
      }

      .price {
        font-size: 1.2rem;
      }

      .book-btn {
        flex: 1;
        justify-content: center;
      }
    }

    @media (max-width: 480px) {
      .slot-header .right-buttons {
        flex-direction: column;
      }

      nav a {
        flex: 1;
        justify-content: center;
        text-align: center;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1 id="turfName">🏟️ Owner Slot Manager</h1>
    <nav>
      <span id="welcomeText">
        <span class="role">🏟️ Turf Owner</span>
        <span class="name">Welcome</span>
      </span>
      <div>
        <a href="owner-dashboard.html">📊 Dashboard</a>
        <a href="my-bookings.html">📋 My Bookings</a>
        <a href="login.html">🚪 Logout</a>
      </div>
    </nav>
  </header>

  <main>
    <h2>📅 Manage Slots</h2>
    <div class="date-selector" id="date-selector"></div>
    <div id="slots"></div>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const turfId = params.get("id");

    if (!turfId) {
      alert("Missing turf ID. Please open this page from the dashboard.");
      window.location.href = "owner-dashboard.html";
    }

    const user = JSON.parse(localStorage.getItem("user"));
    let selectedDate = null;

    if (!user) {
      alert("Please log in first.");
      window.location.href = "login.html";
    }

    document.getElementById("welcomeText").innerHTML = `
      <span class="role">🏟️ Turf Owner</span>
      <span class="name">Welcome, ${user.name}</span>
    `;

    function setupDateSelector() {
      const selector = document.getElementById("date-selector");
      selector.innerHTML = "";
      for (let i = 0; i < 3; i++) {
        const date = new Date();
        date.setDate(date.getDate() + i);
        const label = date.toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" });
        const value = date.toISOString().split("T")[0];
        const btn = document.createElement("button");
        btn.textContent = label;
        btn.onclick = () => {
          document.querySelectorAll(".date-selector button").forEach(b => b.classList.remove("selected"));
          btn.classList.add("selected");
          selectedDate = value;
          loadSlotsForDate(value);
        };
        selector.appendChild(btn);
        if (i === 0) {
          btn.classList.add("selected");
          selectedDate = value;
          loadSlotsForDate(value);
        }
      }
    }

    async function loadSlotsForDate(date) {
      try {
        const res = await fetch(`http://localhost:4001/turfs/${turfId}/slots?date=${date}`);
        const data = await res.json();

        if (!data.turf) {
          document.getElementById("slots").innerHTML = "<p>Failed to load turf info.</p>";
          return;
        }

        document.getElementById("turfName").innerText = `🏟️ ${data.turf.name}`;
        const container = document.getElementById("slots");
        container.innerHTML = "";

        for (const slot of data.slots) {
          const joined = slot.progress.joined || 0;
          const max = slot.max_stranger_players || 0;
          const min = slot.min_players || 0;
          const percent = max > 0 ? Math.min(100, (joined / max) * 100) : 0;

          const strangerLockedIn = joined >= min;
          const strangerFull = joined >= max;

          const hasNormalBooking = slot.bookings.some(b => b.mode === "normal");
          const normalBookingBlocked = hasNormalBooking || strangerLockedIn;

          const waitingText = strangerLockedIn
            ? (strangerFull ? "✅ Stranger play full" : `✅ Locked for normal booking, ${max - joined} more can join`)
            : `⏳ Minimum ${min - joined} more needed`;

          const slotDiv = document.createElement("div");
          slotDiv.className = "slot";

          const bookButtons = normalBookingBlocked
            ? `<div class="right-buttons">
                 <span class="price">₹${slot.price}</span>
                 <button disabled>🔒 Booked</button>
               </div>`
            : `<div class="right-buttons">
                 <span class="price">₹${slot.price}</span>
                 <button class="book-btn" onclick="confirmOfflineBooking('${slot.start}','${slot.end}')">📝 Book (Offline)</button>
               </div>`;

          slotDiv.innerHTML = `
            <div class="slot-header">
              <span>🕐 ${slot.start} - ${slot.end}</span>
              ${bookButtons}
            </div>
            <p class="players-count">👥 ${max > 0 ? `${joined}/${max} players joined` : `${joined} players joined`}</p>
            <div class="progress">
              <div class="progress-fill" style="width:${percent}%;"></div>
            </div>
            <p class="status-text">${waitingText}</p>
            <button class="see-players-btn" onclick="togglePlayers('${slot.start}', '${slot.end}')">👀 See Players</button>
            <div class="player-list" id="players-${slot.start}-${slot.end}"></div>
          `;

          container.appendChild(slotDiv);
        }
      } catch (err) {
        console.error("Error loading slots:", err);
        document.getElementById("slots").innerHTML = "<p>Failed to load slots.</p>";
      }
    }

    async function confirmOfflineBooking(start, end) {
      const ok = confirm(`Confirm offline booking for ${start} - ${end}?`);
      if (!ok) return;
      await bookSlot(start, end, "normal", true);
    }

    async function bookSlot(start, end, mode = "normal", confirm_offline = false) {
      try {
        const res = await fetch("http://localhost:4001/bookings", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            turf_id: turfId,
            slot_date: selectedDate,
            slot_start: start,
            slot_end: end,
            customer_id: user.id,
            mode,
            confirm_offline
          })
        });

        const data = await res.json();
        if (res.ok) {
          alert(`Booked slot ${start} - ${end} ✅`);
          loadSlotsForDate(selectedDate);
        } else {
          alert(data.error || "Booking failed");
        }
      } catch (err) {
        console.error("Booking failed:", err);
        alert("Booking failed. Try again.");
      }
    }

    async function togglePlayers(start, end) {
      const containerId = `players-${start}-${end}`;
      const container = document.getElementById(containerId);
      
      if (container.classList.contains("show")) {
        container.classList.remove("show");
        return;
      }
      
      container.classList.add("show");
      container.innerHTML = "<p>Loading players...</p>";

      try {
        const res = await fetch(`http://localhost:4001/slots/players?turf_id=${turfId}&slot_date=${selectedDate}&slot_start=${start}&slot_end=${end}`);
        const players = await res.json();

        if (!players || players.length === 0) {
          container.innerHTML = "<p>No stranger players in this slot.</p>";
          return;
        }

        container.innerHTML = players.map(p => `
          <div>
            <strong>Booking ID:</strong> #${p.booking_id}<br/>
            <strong>Name:</strong> ${p.name}<br/>
            <strong>Contact:</strong> ${p.contact || "N/A"}
          </div>
        `).join("");
      } catch (err) {
        console.error("Error loading players:", err);
        container.innerHTML = "<p>Failed to load player details ❌</p>";
      }
    }

    function showPlayers(start, end) {
      togglePlayers(start, end);
    }

    setupDateSelector();
  </script>
</body>
</html>
