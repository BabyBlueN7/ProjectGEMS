<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>My Turf Bookings</title>
  <style>
    :root{ --bg:#f6f8fb; --card:#ffffff; --primary:#2563eb; --muted:#6b7280; --text:#071233; --radius:12px; --shadow:0 8px 24px rgba(7,18,51,0.06) }
    body{ font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial; margin:0; padding:0; background:var(--bg); color:var(--text) }
    header{ background:linear-gradient(90deg,var(--primary), #1f4ed8); color:#fff; padding:18px; text-align:center }
    nav{ background:transparent; padding:12px 20px; display:flex; justify-content:space-between; align-items:center; max-width:1100px; margin:0 auto }
    nav a{ color:#fff; font-weight:600; text-decoration:none }
    main{ padding:24px; max-width:1100px; margin:0 auto }
    .booking{ background:var(--card); padding:14px; margin:10px 0; border-radius:10px; box-shadow:var(--shadow); border:1px solid rgba(7,18,51,0.04) }
    .status{ font-weight:700 }
    .booked, .pending{ color:#f59e0b }
    .confirmed{ color:#10b981 }
    .canceled{ color:#ef4444 }
    .empty{ color:var(--muted); font-weight:600 }
  </style>
</head>
<body>
  <header>
    <h1>My Bookings</h1>
    <nav>
      <span id="welcomeText">Welcome</span>
      <div>
        <a href="home.html">Home</a>
        <a href="login.html">Logout</a>
      </div>
    </nav>
  </header>

  <main>
    <h2>Upcoming Turf Slots</h2>
    <div id="bookings"></div>
  </main>

  <script>
    const user = JSON.parse(localStorage.getItem("user"));

    if (!user) {
      alert("Please log in first.");
      window.location.href = "login.html";
    }

    document.getElementById("welcomeText").textContent = `Welcome, ${user.name}`;

    async function loadBookings() {
      const container = document.getElementById("bookings");
      container.innerHTML = "<p>Loading...</p>";

      try {
        const res = await fetch(`http://localhost:4001/bookings/${user.id}`);
        if (!res.ok) throw new Error("Failed to fetch bookings");

        const bookings = await res.json();
        container.innerHTML = "";

        if (!bookings || bookings.length === 0) {
          container.innerHTML = "<p class='empty'>No bookings yet.</p>";
          return;
        }

        bookings.forEach(b => {
  const modeLabel =
    b.mode === "stranger"
      ? "Stranger Play"
      : (b.price_charged === 0 ? "Offline Booking" : "Normal Booking");

  container.innerHTML += `
    <div class="booking">
      <p><strong>Booking ID:</strong> #${b.booking_id || b.id}</p>
      <p><strong>Customer:</strong> ${user.name}</p>
      <p><strong>Turf:</strong> ${b.turf_name} (${b.sport})</p>
      <p><strong>Location:</strong> ${b.location}</p>
      <p><strong>Slot:</strong> ${b.slot_start} - ${b.slot_end}</p>
      <p><strong>Price:</strong> ₹${b.price_charged}</p>
      <p><strong>Mode:</strong> ${modeLabel}</p>
      <p class="status ${b.status}">Status: ${b.status}</p>
    </div>
  `;
});
      } catch (err) {
        console.error("Error loading bookings:", err);
        container.innerHTML = "<p class='empty'>Failed to load bookings ❌</p>";
      }
    }

    loadBookings();
  </script>
</body>
</html>
