<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Turf Slots</title>
  <style>
    body {
      font-family: Arial;
      background: #f0f4f8;
      margin: 0;
      padding: 0;
    }
    header {
      background: #2563eb;
      color: #fff;
      padding: 16px;
      text-align: center;
    }
    main {
      padding: 20px;
    }
    .slot {
      background: #fff;
      padding: 12px;
      margin: 8px 0;
      border-radius: 6px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    .slot-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .price {
      font-weight: bold;
      color: #10b981;
    }
    button {
      background: #10b981;
      color: #fff;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
    }
    button[disabled] {
      background: #ccc;
      cursor: not-allowed;
    }
    button:hover:not([disabled]) {
      background: #0f9a70;
    }
    .progress {
      background: #e5e7eb;
      border-radius: 6px;
      height: 12px;
      margin-top: 6px;
      overflow: hidden;
    }
    .progress-fill {
      background: #2563eb;
      height: 100%;
      border-radius: 6px;
    }
    .status-text {
      margin-top: 4px;
      font-size: 0.9em;
    }
  </style>
</head>
<body>
  <header>
    <h1 id="turfName">Turf Slots</h1>
  </header>
  <main>
    <h2>Available Slots</h2>
    <div id="slots"></div>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const turfId = params.get("id");
    const user = JSON.parse(localStorage.getItem("user"));

    async function loadSlots() {
      try {
        const res = await fetch(`http://localhost:4001/turfs/${turfId}/slots`);
        const data = await res.json();

        document.getElementById("turfName").innerText = data.turf.name;

        const container = document.getElementById("slots");
        container.innerHTML = "";

        for (const slot of data.slots) {
          const joined = slot.progress.joined || 0;
          const target = slot.progress.target || 0;
          const percent = target > 0 ? Math.min(100, (joined / target) * 100) : 0;

          const slotDiv = document.createElement("div");
          slotDiv.className = "slot";

          slotDiv.innerHTML = `
            <div class="slot-header">
              <span>${slot.start} - ${slot.end}</span>
              <span class="price">₹${slot.price}</span>
              ${
                slot.available
                  ? `<button onclick="bookSlot('${slot.start}','${slot.end}')">Book</button>`
                  : `<button disabled>Booked</button>`
              }
            </div>
            <p>${joined}/${target} players joined</p>
            <div class="progress">
              <div class="progress-fill" style="width:${percent}%;"></div>
            </div>
            <p class="status-text">
              ${joined >= target
                ? "✅ Slot locked in!"
                : `⏳ Waiting for more players (${target - joined} more needed)`}
            </p>
          `;

          container.appendChild(slotDiv);
        }
      } catch (err) {
        console.error("Error loading slots:", err);
        document.getElementById("slots").innerHTML = "<p>Failed to load slots.</p>";
      }
    }

    async function bookSlot(start, end) {
      try {
        const res = await fetch("http://localhost:4001/bookings", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            turf_id: turfId,
            slot_start: start,
            slot_end: end,
            customer_id: user.id,
            mode: "stranger"
          })
        });
        const data = await res.json();
        if (res.ok) {
          alert(`Booked slot ${start} - ${end} ✅`);
          loadSlots();
        } else {
          alert(data.error || "Booking failed");
        }
      } catch (err) {
        console.error("Booking failed:", err);
        alert("Booking failed. Try again.");
      }
    }

    loadSlots();
  </script>
</body>
</html>
