<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Turf Slots</title>
  <style>
    body {
      font-family: Arial;
      background: #f0f4f8;
      margin: 0;
      padding: 0;
    }
    header {
      background: #2563eb;
      color: #fff;
      padding: 16px;
      text-align: center;
    }
    main {
      padding: 20px;
    }
    .slot {
      background: #fff;
      padding: 12px;
      margin: 8px 0;
      border-radius: 6px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .price {
      font-weight: bold;
      color: #10b981;
    }
    button {
      background: #10b981;
      color: #fff;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
    }
    button[disabled] {
      background: #ccc;
      cursor: not-allowed;
    }
    button:hover:not([disabled]) {
      background: #0f9a70;
    }
  </style>
</head>
<body>
  <header>
    <h1 id="turfName">Turf Slots</h1>
  </header>
  <main>
    <h2>Available Slots</h2>
    <div id="slots"></div>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const turfId = params.get("id");

    async function loadSlots() {
      try {
        const res = await fetch(`http://localhost:4001/turfs/${turfId}/slots`);
        const data = await res.json();

        document.getElementById("turfName").innerText = data.turf.name;

        const container = document.getElementById("slots");
        container.innerHTML = "";

        data.slots.forEach(slot => {
          container.innerHTML += `
            <div class="slot">
              <span>${slot.start} - ${slot.end}</span>
              <span class="price">₹${slot.price}</span>
              ${
                slot.available
                  ? `<button onclick="bookSlot('${slot.start}','${slot.end}')">Book</button>`
                  : `<button disabled>Booked</button>`
              }
            </div>`;
        });
      } catch (err) {
        console.error("Error loading slots:", err);
        document.getElementById("slots").innerHTML = "<p>Failed to load slots.</p>";
      }
    }

    async function bookSlot(start, end) {
      try {
        const res = await fetch("http://localhost:4001/bookings", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            turf_id: turfId,
            slot_start: start,
            slot_end: end,
            customer_id: 1 // later replace with logged-in user
          })
        });
        const data = await res.json();
        alert(`Booked slot ${start} - ${end} ✅`);
        loadSlots(); // refresh slots so the booked one disables
      } catch (err) {
        console.error("Booking failed:", err);
        alert("Booking failed. Try again.");
      }
    }

    loadSlots();
  </script>
</body>
</html>
