<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Turf Login</title>
  <style>
    body { font-family: Arial; background: #f3f5f7; display: flex; justify-content: center; align-items: center; height: 100vh; }
    .box { background: #fff; padding: 28px; width: 340px; border-radius: 12px; box-shadow: 0 8px 20px rgba(0,0,0,0.08); }
    h2 { text-align: center; margin: 0 0 18px; }
    input { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #cdd4da; border-radius: 8px; }
    button { width: 100%; padding: 10px; margin-top: 10px; background: #2563eb; color: #fff; border: none; border-radius: 8px; cursor: pointer; }
    button:hover { background: #1e4fd6; }
    .links { text-align: center; margin-top: 12px; font-size: 14px; }
    .links a { color: #2563eb; text-decoration: none; }
  </style>
</head>
<body>
  <div class="box">
    <h2>Turf Login</h2>
    <input type="email" id="email" placeholder="Email" />
    <input type="password" id="password" placeholder="Password" />
    <button onclick="login()">Login</button>

    <div class="links">
      <p>No account? <a href="signup-customer.html">Sign up as Customer</a></p>
      <p>Are you a turf owner? <a href="signup-owner.html">Sign up as Owner</a></p>
    </div>
  </div>

  <script>
    async function login() {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      const res = await fetch("http://localhost:4001/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password })
      });

      const data = await res.json();
      if (data.error) alert(data.error);
      else {
        alert("Welcome, " + data.name + " (" + data.role + ")");
        window.location.href = "user.html";
      }
    }
  </script>
</body>
</html>
