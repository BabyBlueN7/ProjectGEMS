<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Turf Login</title>
  <style>
    :root{ --bg:#f6f8fb; --card:#fff; --primary:#2563eb; --muted:#6b7280; --text:#071233; --radius:12px; --shadow:0 12px 30px rgba(7,18,51,0.06) }
    html,body{height:100%}
    body{ margin:0; font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial; background:var(--bg); color:var(--text); display:flex; align-items:center; justify-content:center }
    .box{ background:var(--card); padding:28px; width:380px; border-radius:var(--radius); box-shadow:var(--shadow); border:1px solid rgba(7,18,51,0.04) }
    h2{ text-align:center; margin:0 0 14px; font-weight:700 }
    input{ width:100%; padding:10px 12px; margin:8px 0; border-radius:10px; border:1px solid rgba(7,18,51,0.06); background:#fbfdff }
    button{ width:100%; padding:10px; margin-top:10px; background:var(--primary); color:#fff; border:none; border-radius:10px; cursor:pointer; font-weight:600 }
    button:hover{ filter:brightness(.96) }
    .links{ text-align:center; margin-top:12px; color:var(--muted) }
    .links a{ color:var(--primary); text-decoration:none }
    .devtool-link{ position:fixed; bottom:16px; left:16px; font-size:13px }
    .devtool-link a{ color:var(--muted); text-decoration:none }
  </style>
</head>
<body>
  <div class="box">
    <h2>Turf Login</h2>
    <input type="email" id="email" placeholder="Email" />
    <input type="password" id="password" placeholder="Password" />
    <button onclick="login()">Login</button>

    <div class="links">
      <p>No account? <a href="signup-customer.html">Sign up as Customer</a></p>
      <p>Are you a turf owner? <a href="signup-owner.html">Sign up as Owner</a></p>
    </div>
  </div>

  <!-- 🔐 Devtool Access (hidden in corner) -->
  <div class="devtool-link">
    <a href="devtool-login-turf.html">Devtool Access</a>
  </div>

  <script>
    async function login() {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      try {
        const res = await fetch("http://localhost:4001/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();

        if (res.ok && !data.error) {
          localStorage.setItem("user", JSON.stringify(data));
          // Set login cookie (expires in 7 days)
          const expiry = new Date();
          expiry.setTime(expiry.getTime() + (7 * 24 * 60 * 60 * 1000));
          document.cookie = `kickhub_user=${data.id}; expires=${expiry.toUTCString()}; path=/`;
          alert("Welcome, " + data.name + " (" + data.role + ")");

          if (data.role === "owner") {
            window.location.href = `owner-dashboard.html?id=${data.id}`;
          } else {
            window.location.href = `home.html`;
          }
        } else {
          alert(data.error || "Login failed");
        }
      } catch (err) {
        console.error("Login error:", err);
        alert("Something went wrong. Try again.");
      }
    }
  </script>
</body>
</html>
