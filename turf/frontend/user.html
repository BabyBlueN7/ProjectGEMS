<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Turf List</title>
  <style>
    body { font-family: Arial; background: #f9fafb; margin: 0; padding: 0; }
    header h1 { margin: 0; padding: 16px; background: #2563eb; color: #fff; text-align: center; }
    nav {
      background: #fff;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }
    nav a {
      text-decoration: none;
      color: #2563eb;
      font-weight: bold;
      margin-left: 12px;
    }
    .controls { padding: 20px; text-align: center; }
    select {
      padding: 8px;
      font-size: 16px;
      border-radius: 6px;
    }
    .turf-list { padding: 20px; }
    .turf {
      background: #fff;
      padding: 16px;
      margin: 12px 0;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      cursor: pointer;
    }
    .turf:hover { background: #eef4ff; }
    .location { font-size: 14px; color: #555; }
    .price { font-weight: bold; color: #10b981; }
    .contact { font-size: 14px; color: #374151; margin-top: 8px; }
  </style>
</head>
<body>
  <header>
    <h1>TURFS</h1>
    <nav>
      <span id="welcomeText">Welcome, Player</span>
      <div>
        <span id="wallet" style="font-weight:bold; color:#10b981; margin-right: 20px;">0</span>
        <a href="wallet.html">Add Money</a>
        <a href="my-bookings.html">My Bookings</a>
        <a href="login.html">Logout</a>
      </div>
    </nav>
  </header>

  <div class="controls">
    <label for="district">Select District:</label>
    <select id="district" onchange="loadTurfsByDistrict()">
      <option value="">-- Choose District --</option>
      <option value="Malappuram">Malappuram</option>
      <option value="Kannur">Kannur</option>
      <option value="Kozhikode">Kozhikode</option>
    </select>
  </div>

  <main class="turf-list" id="turfList">
    <p>Select a district to view turfs.</p>
  </main>

  <script>
    async function loadTurfsByDistrict() {
      const district = document.getElementById("district").value;
      const list = document.getElementById("turfList");

      if (!district) {
        list.innerHTML = "<p>Select a district to view turfs.</p>";
        return;
      }

      try {
        const res = await fetch(`http://localhost:4001/turfs/by-district/${encodeURIComponent(district)}`);
        if (!res.ok) throw new Error("Network response was not ok");
        const turfs = await res.json();

        list.innerHTML = "";

        if (turfs.length === 0) {
          list.innerHTML = "<p>No turfs found in this district.</p>";
          return;
        }

        turfs.forEach(turf => {
          const div = document.createElement("div");
          div.className = "turf";
          div.innerHTML = `
            <h3>${turf.name}</h3>
            <p class="location">${turf.location}</p>
            <p>${turf.sport}</p>
            <p class="price">₹${turf.price}/hr</p>
            ${turf.contact ? `<p class="contact"><strong>Contact:</strong> ${turf.contact}</p>` : ""}
          `;
          div.onclick = () => {
            window.location.href = `turf-slots.html?id=${turf.id}`;
          };
          list.appendChild(div);
        });
      } catch (err) {
        console.error("Error loading turfs:", err);
        list.innerHTML = "<p>Failed to load turfs. Check console for details.</p>";
      }
    }

    document.addEventListener("DOMContentLoaded", async () => {
      const user = JSON.parse(localStorage.getItem("user"));
      const walletSpan = document.getElementById("wallet");
      const welcomeText = document.getElementById("welcomeText");

      if (!user?.id) {
        walletSpan.textContent = "Wallet: ₹0";
        welcomeText.textContent = "Welcome, Player";
        return;
      }

      welcomeText.textContent = `Welcome, ${user.name}`;

      try {
        const res = await fetch(`http://localhost:4001/wallet/${user.id}`);
        const data = await res.json();
        walletSpan.textContent = `Wallet: ₹${data.balance}`;
      } catch (err) {
        console.error("Failed to fetch wallet balance:", err);
        walletSpan.textContent = "Wallet: ₹0";
      }
    });
  </script>
</body>
</html>
