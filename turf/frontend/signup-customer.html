<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Customer Sign Up</title>
  <style>
    :root{ --bg:#f6f8fb; --card:#fff; --primary:#2563eb; --accent:#10b981; --muted:#6b7280; --text:#071233; --radius:12px; --shadow:0 10px 30px rgba(7,18,51,0.06) }
    html,body{height:100%}
    body{ margin:0; font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial; background:var(--bg); display:flex; align-items:center; justify-content:center }
    .box{ background:var(--card); padding:28px; width:360px; border-radius:var(--radius); box-shadow:var(--shadow); border:1px solid rgba(7,18,51,0.04) }
    h2{ text-align:center; margin:0 0 16px; font-weight:700 }
    input{ width:100%; padding:10px 12px; margin:8px 0; border-radius:10px; border:1px solid rgba(7,18,51,0.06); background:#fbfdff }
    button{ width:100%; padding:10px; margin-top:10px; background:var(--accent); color:#fff; border:none; border-radius:10px; cursor:pointer; font-weight:600 }
    button:hover{ filter:brightness(.96) }
    .links{ text-align:center; margin-top:12px; color:var(--muted) }
    .links a{ color:var(--primary); text-decoration:none }
  </style>
</head>
<body>
  <div class="box">
    <h2>Customer Sign Up</h2>
    <input type="text" id="name" placeholder="Name" />
    <input type="email" id="email" placeholder="Email" />
    <input type="text" id="contact" placeholder="Phone Number" />
    <input type="password" id="password" placeholder="Password" />
    <button onclick="signup()">Create Account</button>
    <div class="links">
      <p>Already have an account? <a href="login.html">Login</a></p>
    </div>
  </div>

  <script>
    async function signup() {
      const name = document.getElementById("name").value;
      const email = document.getElementById("email").value;
      const contact = document.getElementById("contact").value;
      const password = document.getElementById("password").value;

      const res = await fetch("http://localhost:4001/signup", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name, email, contact, password, role: "customer" })
      });

      const data = await res.json();
      if (data.error) {
        alert(data.error);
      } else {
        alert("Customer account created!");
        localStorage.setItem("user", JSON.stringify(data));
        // Set login cookie (expires in 7 days)
        const expiry = new Date();
        expiry.setTime(expiry.getTime() + (7 * 24 * 60 * 60 * 1000));
        document.cookie = `kickhub_user=${data.id}; expires=${expiry.toUTCString()}; path=/`;
        window.location.href = "customer-dashboard.html";
      }
    }
  </script>
</body>
</html>
